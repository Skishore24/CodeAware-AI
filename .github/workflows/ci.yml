name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      SECRET_KEY: ci-test-secret-key-for-codeaware-ai-2026

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Install Dependencies
        run: |
          uv sync --all-extras

      - name: Run Ruff Lint Check
        run: |
          uv run ruff check tests/

      - name: Run Backend Pytest Suite
        run: |
          uv run pytest tests/ -v --cov=app --cov-report=term-missing

  frontend-checks:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Run Oxlint Linter
        working-directory: ./frontend
        run: |
          npm run lint

      - name: Build Production Frontend Bundle
        working-directory: ./frontend
        run: |
          npm run build
