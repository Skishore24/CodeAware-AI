[project]
name = "codeaware-ai"
version = "1.0.0"
description = "Autonomous Code Intelligence Platform — local-first developer intelligence with Ollama, MySQL, RAG, and multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "networkx>=3.2.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "gitpython>=3.1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
