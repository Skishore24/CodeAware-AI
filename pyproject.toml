[project]
name = "codeaware-ai"
version = "0.1.0"
description = "Autonomous Code Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "gitpython>=3.1.42",
    "networkx>=3.2.1",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.2",
    "sqlalchemy>=2.0.28",
    "pymysql>=1.1.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.vercel]
entrypoint = "backend.app.main:app"
